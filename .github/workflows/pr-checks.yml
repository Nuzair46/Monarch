name: Windows PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> src-tauri/target
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build
      - run: cargo test --locked
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: yarn build:msi
      - uses: actions/upload-artifact@v4
        with:
          name: monarch-windows-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            src-tauri/target/release/monarch-desktop.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
